databases:
  - name: digital-card-db
    plan: free
    databaseName: digital_card
    user: digital_card
    postgresMajorVersion: '17'
    ipAllowList: []

services:
  - type: web
    name: digital-card-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-card-db
          property: connectionString
